global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local-test
    region: eu-west-1
    tenant: tenant-b
    agent: prometheus-agent-b

scrape_configs:
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter-test:9100']
        labels:
          source: 'node'
          tenant: 'tenant-b'

  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter-test:9121']
        labels:
          source: 'redis'
          tenant: 'tenant-b'

remote_write:
  - url: 'http://host.docker.internal:8080/api/v1/push'
    headers:
      X-Scope-OrgID: 'tenant-b'
    queue_config:
      capacity: 2500
      max_shards: 10
      min_shards: 2
      max_samples_per_send: 100
      batch_send_deadline: 5s